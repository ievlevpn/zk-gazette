# Zero-server Gazette deployment using GitHub Actions + GitHub Pages.
#
# How to use:
#   1. Create your own repository (or fork zk-gazette) and copy this file to:
#        .github/workflows/gazette.yml
#   2. Copy generator/config.example.json -> generator/config.json and customize your feeds,
#      city weather, and public event watches.
#      (Privacy tip: GitHub Pages is public on free accounts — do NOT put private calendar
#      .ics URLs or personal secrets into a public GitHub Pages edition!)
#   3. In your repo Settings -> Pages, set Source to "GitHub Actions".
#   4. Run the workflow once manually (Actions -> Daily Gazette -> Run workflow), then paste
#      https://<your-username>.github.io/<your-repo>/today.json
#      into Gazette -> Settings on your Kindle.

name: Daily Gazette

on:
  schedule:
    # Runs every morning at 05:30 UTC (adjust for your time zone).
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gazette-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate today.json
        run: |
          mkdir -p site
          python3 generator/generate.py \
            --config generator/config.json \
            --out site/today.json \
            --no-llm \
            --no-push

      - name: Validate today.json
        run: python3 generator/validate.py site/today.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
